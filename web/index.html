<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feral AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" id="search-btn" title="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <button class="icon-btn" id="new-btn" title="New Bot">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <input class="search" id="search" placeholder="Search Bots" hidden />

      <button class="primary-bot" id="primary-bot"></button>

      <nav class="bot-list" id="bot-list"></nav>

      <button class="hidden-bots" id="hidden-btn">
        <span id="hidden-label">Hidden Bots</span><span id="hidden-count"></span>
      </button>

      <div class="sidebar-bottom">
        <div class="me">
          <div class="me-avatar" id="me-avatar"></div>
          <span id="me-name"></span>
        </div>
        <button class="icon-btn" title="Apps">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M17 14v6M14 17h6"/></svg>
        </button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div class="bot-pill" id="bot-pill"></div>
        <button class="share-btn screen-btn" id="screen-btn" title="Watch this Bot's screen">Screen</button>
        <button class="share-btn">Share</button>
      </header>

      <section class="messages" id="messages"></section>

      <button class="scroll-down" id="scroll-down" title="Scroll to bottom">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>

      <form class="composer" id="composer">
        <button type="button" class="composer-plus" title="Attach">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input id="input" autocomplete="off" />
        <button type="button" class="composer-mic" title="Voice note">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
        <button type="submit" class="composer-voice" title="Send">
          <svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        </button>
      </form>
      <div class="footnote"><b>Feral AI</b> · open source, self-hosted</div>

      <div class="model-bar" id="model-bar" hidden>
        <select id="model-select" title="Model"></select>
        <select id="effort-select" title="Reasoning effort"></select>
      </div>
    </main>

    <aside class="details" id="details" hidden></aside>

    <aside class="screen" id="screen" hidden>
      <div class="screen-bar">
        <span id="screen-title"></span>
        <button class="screen-take" id="screen-take">Take over</button>
        <button class="icon-btn" id="screen-close" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="screen-view">
        <iframe id="screen-frame" title="Bot screen" allow="clipboard-read; clipboard-write"></iframe>
        <div class="screen-shield" id="screen-shield" title="Click Take over to use this screen"></div>
        <div class="screen-msg" id="screen-msg" hidden></div>
      </div>
    </aside>
  </div>
  <div class="modal-backdrop" id="nb" hidden>
    <form class="modal" id="nb-form" autocomplete="off">
      <div class="modal-head">
        <h3>Create New Bot</h3>
        <button type="button" class="modal-close" id="nb-close" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="nb-preview" id="nb-preview"></div>
        <input class="nb-input" id="nb-name" maxlength="60" placeholder="Name your Bot" />
        <div class="nb-shapes" id="nb-shapes"></div>
        <div class="nb-colors" id="nb-colors"></div>
        <div class="nb-error" id="nb-error" hidden></div>
      </div>
      <div class="modal-foot">
        <label class="nb-runs">Runs on <select id="nb-harness"></select></label>
        <button type="button" class="nb-btn" id="nb-cancel">Cancel</button>
        <button type="submit" class="nb-btn primary" id="nb-create">Create</button>
      </div>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
