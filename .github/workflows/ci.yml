name: ci
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - name: smoke
        run: |
          mkdir -p /tmp/sh && cd /tmp/sh
          DATA_DIR=/tmp/sh/data WORKSPACE_DIR=/tmp/sh/ws SCREENS=off PORT=3999 $GITHUB_WORKSPACE/target/release/botd &
          for i in $(seq 1 30); do curl -sf localhost:3999/healthz && break; sleep 1; done
          curl -sf localhost:3999/ | grep -qi feral
          if [ -f $GITHUB_WORKSPACE/deploy/smoke.sh ]; then bash $GITHUB_WORKSPACE/deploy/smoke.sh http://localhost:3999; fi
  supabase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci, PGDATABASE: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/customer_cap.sh
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: |
          for n in 1 2 3 4; do cp deploy/customers/example.env deploy/customers/c$n.env; done
          docker compose -f deploy/compose.yml --profile c1 --profile c2 --profile c3 --profile c4 config -q
      - name: build arm64 image
        run: docker build -t feralai:latest .
      - name: run one customer
        run: |
          echo "AUTH_PASSWORD=ci-test" >> deploy/customers/c1.env
          docker compose -f deploy/compose.yml --profile c1 up -d
          for i in $(seq 1 30); do curl -sf localhost:3101/healthz && break; sleep 2; done
          docker exec feralai-c1 id -u | grep -qx 10001
          docker inspect feralai-c1 --format '{{.HostConfig.Memory}}' | grep -qx 2147483648
          docker logs feralai-c1
